schema_version = 1
target_id = "autodev-acceptance"

[build]
dockerfile = "Dockerfile"
dependency_locks = ["requirements.txt"]

[verification]
[[verification.gates]]
id = "tests"
command = ["python", "-m", "pytest"]
timeout_seconds = 120

[deployment]
container_port = 8000
health_path = "/health"
readiness_path = "/ready"
startup_timeout_seconds = 60

[performance]
script_path = "tests/load.js"
required_threshold_metrics = ["http_req_failed"]
timeout_seconds = 120

[canary]
max_candidate_error_rate = 0.02
max_error_rate_delta = 0.01
max_candidate_p95_latency_ms = 500.0
max_p95_latency_ratio = 2.0

[[canary.stages]]
weight_percent = 100
min_duration_seconds = 1
min_requests = 1
