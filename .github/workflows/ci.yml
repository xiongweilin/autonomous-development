name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint
        run: pipx run --spec "actionlint-py==1.7.12.24" actionlint -color
      - name: zizmor
        run: pipx run "zizmor==1.30.1" --persona=regular .github/workflows
      - name: gitleaks
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz"             "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner --exit-code 1
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src --no-incremental --show-error-codes
      - name: Architecture
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -m "not integration" --cov=src/autonomous_development --cov-report=term-missing --cov-fail-under=85
      - name: Generate lock artifact
        run: uv lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autodev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autodev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUTODEV_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/autodev
      DBOS_SYSTEM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/autodev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --extra dev
      - name: Migration roundtrip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Locate PostgreSQL service container
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:17-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          echo "AUTODEV_POSTGRES_CONTAINER=$container_id" >> "$GITHUB_ENV"
      - name: PostgreSQL durability and backup restore
        run: uv run pytest -m integration tests/integration
