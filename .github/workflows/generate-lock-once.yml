name: Generate lock once

on:
  push:
    branches:
      - fix/v1-production-acceptance-blockers
    paths:
      - .github/workflows/generate-lock-once.yml
      - pyproject.toml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v1-production-acceptance-blockers
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: "3.12"
      - name: Generate committed lock
        run: |
          set -euo pipefail
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: commit reproducible uv lock"
          git push origin HEAD:fix/v1-production-acceptance-blockers
